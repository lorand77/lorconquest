<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LorConquest</title>
    <link rel="stylesheet" href="/css/game.css">
    <script src="/js/theme.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/game.js"></script>
</head>
<body class="game">
    <main class="board">
        <section class="mapbox">
            <div id="map" class="map"></div>
            <div class="zoom">
                <button id="zoom-in" title="Zoom in">+</button>
                <button id="zoom-out" title="Zoom out">−</button>
            </div>
            <div id="toasts" class="toasts"></div>
            <section id="chat" class="chat" hidden>
                <ul id="chat-log" class="chat-log"></ul>
                <form id="chat-form" class="chat-form">
                    <input id="chat-text" maxlength="300" autocomplete="off" placeholder="Say something to the others">
                    <button class="primary" type="submit">Send</button>
                </form>
            </section>
        </section>
        <aside class="side">
            <div class="head">
                <a class="brand" href="/">⬡ LorConquest</a>
                <span><button class="scheme" data-scheme-toggle>☀ Light</button> <a class="lobby-link" href="/">← Lobby</a></span>
            </div>
            <div class="status">
                <span id="me" class="me"></span>
                <span id="date" class="date"></span>
                <div class="row">
                    <button id="pause" class="pause">▶ Play</button>
                    <span id="treasury" class="treasury"></span>
                </div>
                <span id="setup" class="setup" hidden></span>
                <div id="people" class="people"></div>
            </div>
            <nav id="tabs" class="tabs">
                <button data-tab="selection" class="active"><span class="tab-icon">🗺️</span><span>Map</span></button>
                <button data-tab="country"><span class="tab-icon">🏰</span><span>Country</span></button>
                <button data-tab="shop"><span class="tab-icon">🛒</span><span>Shop</span></button>
                <button data-tab="research"><span class="tab-icon">📚</span><span>Research</span></button>
                <button data-tab="diplomacy"><span class="tab-icon">🤝</span><span>Diplomacy</span></button>
                <button data-tab="events" id="events-tab"><span class="tab-icon">📰</span><span id="events-label">Events</span></button>
            </nav>
            <div id="panel" class="panel"></div>
            <ul id="events" class="events" hidden></ul>
            <div class="foot">
                <button id="chat-toggle" hidden>Chat</button>
                <button id="quit" class="danger" hidden title="Give your country to the computer for good">Leave the game</button>
            </div>
        </aside>
    </main>
</body>
</html>
