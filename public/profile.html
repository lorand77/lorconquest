<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LorConquest — My Profile</title>
    <link rel="stylesheet" href="/css/game.css">
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/profile.js"></script>
</head>
<body class="shell">
    <div class="page">
        <h1 id="name">My Profile</h1>
        <p id="joined" class="hint"></p>
        <nav class="profile-tabs">
            <a id="tab-stats" href="#stats">📊 Stats</a>
            <a id="tab-games" href="#games">📜 My Games</a>
        </nav>

        <section id="stats-panel" class="page-section">
            <h2>Stats</h2>
            <div id="stat-grid" class="stats"></div>
            <p class="hint">A game won is the player's country winning the whole game. "First among people" and the average place count the
                finished games played with others, as on the <a href="/leaderboard.html">leaderboard</a>.</p>
        </section>

        <section id="games-panel" class="page-section" hidden>
            <h2 id="games-title">My Games</h2>
            <ul id="game-list" class="games"></ul>
        </section>
    </div>
</body>
</html>
