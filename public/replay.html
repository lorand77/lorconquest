<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LorConquest — replay</title>
    <link rel="stylesheet" href="/css/game.css">
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/replay.js"></script>
</head>
<body class="game replay">
    <main class="board">
        <section class="mapbox">
            <div id="map" class="map"></div>
            <div class="zoom">
                <button id="zoom-in" title="Zoom in">+</button>
                <button id="zoom-out" title="Zoom out">−</button>
            </div>
            <div id="toasts" class="toasts"></div>
        </section>
        <aside class="side">
            <div class="head">
                <a class="brand" href="/">⬡ LorConquest</a>
                <span><button class="scheme" data-scheme-toggle>☀ Light</button> <a class="lobby-link" href="/">← Lobby</a></span>
            </div>
            <div class="status">
                <span id="title" class="me"></span>
                <span id="date" class="date"></span>
                <input id="seek" class="seek" type="range" min="0" max="1" value="0" step="1" aria-label="Day">
                <div class="row">
                    <button id="play" class="pause">▶ Play</button>
                    <label>Speed <select id="speed">
                        <option value="10">10 days a second</option>
                        <option value="50">50</option>
                        <option value="250" selected>250</option>
                        <option value="1000">1000</option>
                    </select></label>
                </div>
                <span id="verdict" class="verdict"></span>
            </div>
            <h3>Standing</h3>
            <ol id="standing" class="standing"></ol>
            <h3>Events</h3>
            <ul id="events" class="events"></ul>
        </aside>
    </main>
</body>
</html>
