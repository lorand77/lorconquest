<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LorConquest — Customize</title>
    <link rel="stylesheet" href="/css/game.css">
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/customize.js"></script>
</head>
<body class="shell">
    <div class="page">
        <h1>Customize</h1>
        <section class="page-section">
            <h2>Colours</h2>
            <div id="schemes" class="choices">
                <label class="choice"><input type="radio" name="scheme" value="dark"> 🌙 Dark</label>
                <label class="choice"><input type="radio" name="scheme" value="light"> ☀ Light</label>
            </div>
            <p class="hint">Every page follows your choice, the game too (its sidebar has the same switch). It is kept in this
                browser only, as the <a href="/privacy.html">Privacy Policy</a> says.</p>
        </section>
    </div>
</body>
</html>
