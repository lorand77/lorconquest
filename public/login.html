<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LorConquest — sign in</title>
    <link rel="stylesheet" href="/css/game.css">
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/login.js"></script>
</head>
<body class="auth">
    <div class="auth-card">
        <h1>LorConquest</h1>
        <p class="tagline">Real-time grand strategy on a map of Mitteleuropa, 1440–1650. Sign in to play.</p>

        <form id="login" autocomplete="on">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="20" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" required>

            <div class="auth-actions">
                <button type="submit" class="primary" data-action="login">Log in</button>
                <button type="submit" data-action="register">Register</button>
            </div>
        </form>

        <div class="auth-error error" id="error"></div>

        <p class="auth-legal">A name is 3–20 letters, digits or underscores; a password 6 or more characters. By registering you
            agree to the <a href="/terms.html">Terms of Service</a> and the <a href="/privacy.html">Privacy Policy</a>.</p>
        <p class="auth-legal"><button class="scheme" data-scheme-toggle>☀ Light</button></p>
    </div>
</body>
</html>
